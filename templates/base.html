<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title|default("図書館貸出管理") }}</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
      nav { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; }
      table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
      th, td { border: 1px solid #ddd; padding: .55rem; text-align: left; }
      th { background: #f4f6f8; }
      label { display: block; margin-top: .8rem; font-weight: 600; }
      input, select { width: min(28rem, 100%); padding: .45rem; }
      button, .button { display: inline-block; padding: .45rem .75rem; margin-top: .8rem; }
      .errors { color: #b00020; margin: .25rem 0 0; }
      .flash { background: #eef7ee; border: 1px solid #b7dfb7; padding: .7rem; margin-bottom: .8rem; }
      .actions { display: flex; gap: .5rem; align-items: center; }
    </style>
  </head>
  <body>
    <nav>
      <a href="{{ url_for('books.book_list') }}">本一覧</a>
      <a href="{{ url_for('users.user_list') }}">利用者一覧</a>
      <a href="{{ url_for('borrows.active_list') }}">貸出中一覧</a>
      <a href="{{ url_for('borrows.borrow_create') }}">新規貸出</a>
      {% if g.admin_user %}
        <span>管理者: {{ g.admin_user.username }}</span>
        <form action="{{ url_for('auth.logout') }}" method="post">
          <button type="submit">ログアウト</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">ログイン</a>
        <a href="{{ url_for('auth.signup') }}">サインアップ</a>
      {% endif %}
    </nav>

    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </body>
</html>
