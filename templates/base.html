<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}図書館貸出管理{% endblock %}</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#223}
    nav{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin-bottom:1.5rem}
    table{border-collapse:collapse;width:100%;margin:1rem 0}
    th,td{border:1px solid #ddd;padding:.6rem;text-align:left}th{background:#eef3f7}
    label{display:block;margin:.8rem 0 .2rem;font-weight:600}
    input,select{max-width:100%;padding:.45rem}
    button,.button{display:inline-block;padding:.45rem .75rem;margin:.5rem 0;cursor:pointer}
    .errors{color:#b00020}.flash{padding:.7rem;background:#eef7ee;border:1px solid #b7dfb7;margin-bottom:.8rem}
    .actions{display:flex;gap:.5rem}
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('books.book_list') }}">本一覧</a>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('users.user_list') }}">利用者一覧</a>
      <a href="{{ url_for('borrows.active_list') }}">貸出中一覧</a>
      <a href="{{ url_for('borrows.borrow_create') }}">新規貸出</a>
      <a href="{{ url_for('auth.signup') }}">管理者追加</a>
      <span>管理者: {{ current_user.username }}</span>
      <form action="{{ url_for('auth.logout') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">ログアウト</button>
      </form>
    {% else %}
      <a href="{{ url_for('auth.login') }}">ログイン</a>
    {% endif %}
  </nav>
  {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
