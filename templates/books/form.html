{% extends "base.html" %}
{% from "macros.html" import render_field %}

{% block content %}
  <h1>{{ title }}</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    {{ render_field(form.title) }}
    {{ render_field(form.author) }}
    {{ render_field(form.genre) }}
    {{ render_field(form.stock) }}
    {{ form.submit() }}
  </form>
{% endblock %}
