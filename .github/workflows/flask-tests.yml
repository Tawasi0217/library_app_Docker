name: Flask application tests
on:
  push:
    branches: ["feat/flask-textbook-alignment-20261020"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py blueprints forms.py models.py validators.py
      - run: python -m pytest -q tests
