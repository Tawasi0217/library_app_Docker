version: "3.8"

services:
  web:
    image: library-loan-app:latest
    environment:
      SECRET_KEY: change-this-secret-key
      DATABASE_URL: sqlite:////app/instance/library.db
      GUNICORN_WORKERS: "2"
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: ingress
    volumes:
      - library_data:/app/instance
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first

volumes:
  library_data:
