services:
  web:
    image: ${LIBRARY_IMAGE:?Set LIBRARY_IMAGE to an image accessible by Swarm nodes}
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DATABASE_URL: sqlite:////app/instance/library.db
      GUNICORN_WORKERS: "2"
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: ingress
    volumes:
      - library_data:/app/instance
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first
volumes:
  library_data:
